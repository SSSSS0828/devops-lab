permissions:
  contents: read
  packages: write

# 工作流名字
name: DevOps CI
# 触发条件
on:
  # push
  push:
    branches:
      - main
  # 合并请求
  pull_request:
    branches:
      - main

jobs:
  # job 名字
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # 拉代码到虚拟机中
        uses: actions/checkout@v4

      - name: Validate Compose
        ## 校验语法
        run: docker compose config

      - name: Build images
        # 构建镜像
        run: docker compose build

      - name: Start services
        # 启动
        run: docker compose up -d

      - name: Wait and test
        run: |
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1/health; then
              echo "Service is healthy"
              exit 0
            fi

            echo "Waiting for service..."
            sleep 5
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down

  publish:
    needs: build-test

    # 只有 push main 才构建推送镜像
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sssss0828/devops-api:${{ github.sha }}
            ghcr.io/sssss0828/devops-api:latest

  deploy:
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
          '
              set -e

              cd /srv/devops-lab

              # 记录当前线上版本，用于部署失败后的回滚
              PREVIOUS_SHA=$(git rev-parse HEAD)
              PREVIOUS_IMAGE=$(docker inspect devops-api --format "{{.Config.Image}}")

              git fetch origin

              git checkout --detach ${{ github.sha }}

              export API_IMAGE="ghcr.io/sssss0828/devops-api:${{ github.sha }}"
              export APP_ENV="${{ secrets.APP_ENV }}"

              docker compose pull api
              docker compose up -d --no-build

              # 最多等待约 60 秒检查新版本
              DEPLOY_OK=false

              for i in {1..12}; do
                if curl -fsS http://127.0.0.1/health >/dev/null; then
                  DEPLOY_OK=true
                  break
                fi

                echo "Waiting for application health check..."
                sleep 5
              done

              # 新版本不健康：恢复旧 Commit + 旧镜像
              if [ "$DEPLOY_OK" != "true" ]; then
                echo "Deployment failed, rolling back..."

                git checkout --detach "$PREVIOUS_SHA"
                export API_IMAGE="$PREVIOUS_IMAGE"

                docker compose up -d --no-build

                sleep 5
                curl -fsS http://127.0.0.1/health

                echo "Rollback completed"
                exit 1
              fi

              echo "Deployment successful: ${{ github.sha }}"
          '
